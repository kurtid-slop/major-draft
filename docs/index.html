<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Spin a CS Major and a team five times, sign one player each round, and see where your lineup would have placed.">
<meta name="theme-color" content="#0b1018">
<title>Major Draft</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Two slot drums on top, the five players to sign under them, the lineup below. Stats only appear on the final screen. */
:root {
  color-scheme: dark;
  --bg: #0b1018;
  --panel: #151c27;
  --panel-2: #1d2633;
  --line: #2b3646;
  --fg: #e9edf3;
  --muted: #8b97a8;
  --gold: #e4b84a; --gold-ink: #1b1405;
  --major: #8e44f2; --major-hi: #b37bff; --major-lo: #5d22b0;
  --team: #f0901e; --team-hi: #ffb455; --team-lo: #b45f06;
  --drum: #2a3442; --drum-hi: #46546a; --drum-lo: #121820;
  --r-grey: #b0c3d9; --r-light: #5e98d9; --r-blue: #4b69ff; --r-purple: #8847ff;
  --r-pink: #d32ce6; --r-red: #eb4b4b; --r-gold: #e4ae39;
  --good: #5cc98a; --bad: #e0675f;
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-body); }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.eyebrow { font: 600 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.top h1 { font-size: 30px; line-height: 1; font-weight: 700; text-transform: uppercase; }
.top h1 span { color: var(--gold); }
.top-right { display: flex; align-items: center; gap: 12px; }
.round { font: 600 14px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.round b { color: var(--fg); font-family: var(--f-mono); }
.sound { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 7px 12px; font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.sound[aria-pressed="false"] { color: var(--muted); }
.top-right { flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.seg button.on { background: var(--gold); color: var(--gold-ink); }
.seg button:disabled:not(.on) { opacity: .45; cursor: not-allowed; }

/* Slot drums */
.machine { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.cell { display: grid; gap: 8px; min-width: 0; }
.frame { --c: var(--major); --c-hi: var(--major-hi); --c-lo: var(--major-lo);
  border-radius: 14px; padding: 0 8px 8px; background: linear-gradient(180deg, var(--c-hi), var(--c) 30%, var(--c-lo));
  box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
.frame.team { --c: var(--team); --c-hi: var(--team-hi); --c-lo: var(--team-lo); }
.frame .lbl { display: block; text-align: center; padding: 5px 0 4px; font: 700 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: rgba(0,0,0,.62); }
.drum { position: relative; height: 84px; border-radius: 9px; overflow: hidden;
  background: linear-gradient(180deg, var(--drum-lo) 0%, var(--drum) 22%, var(--drum-hi) 50%, var(--drum) 78%, var(--drum-lo) 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.5); }
/* metal side caps tinted with the frame colour */
.drum::before, .drum::after { content: ""; position: absolute; top: 0; bottom: 0; width: 12px; z-index: 3;
  background: linear-gradient(90deg, #6d7686, #d9dee6 35%, #8a93a2 60%, var(--c) 61%, var(--c-lo)); }
.drum::before { left: 0; }
.drum::after { right: 0; transform: scaleX(-1); }
.shade { position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,11,16,.85) 0%, rgba(8,11,16,0) 34%, rgba(8,11,16,0) 66%, rgba(8,11,16,.85) 100%); }
.strip { position: absolute; left: 12px; right: 12px; top: 0; will-change: transform; }
.row { height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 6px;
  font: 700 26px/1 var(--f-display); color: #f4f6f9; text-shadow: 0 2px 0 rgba(0,0,0,.55); white-space: nowrap; overflow: hidden; text-transform: uppercase; letter-spacing: .02em; }
.row.s { font-size: 21px; } .row.xs { font-size: 17px; }
.row.ghost { color: rgba(244,246,249,.35); }
.sub { text-align: center; font-size: 13px; color: var(--muted); min-height: 1.5em; overflow-wrap: anywhere; }
.sub .chip { margin-left: 4px; }
.respin { justify-self: center; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 7px 14px; font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.respin:disabled { opacity: .35; cursor: not-allowed; }
.respin:hover:not(:disabled) { border-color: var(--muted); }

.spin { justify-self: center; min-width: 220px; border: 0; border-radius: 12px; padding: 15px 28px; background: linear-gradient(180deg, #f5cf6a, var(--gold) 45%, #b98d22); color: var(--gold-ink);
  font: 700 20px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 5px 0 #7d5e12, 0 8px 18px rgba(0,0,0,.4); }
.spin:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #7d5e12; }
.spin:disabled { opacity: .5; cursor: not-allowed; }
.hint { text-align: center; color: var(--muted); font-size: 13.5px; margin: 0; }

.chip { display: inline-block; font: 600 10.5px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); vertical-align: 1px; }
.chip.win { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

/* Player choices */
.pgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pcard { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); padding: 14px 8px 16px; display: grid; gap: 4px; position: relative; overflow: hidden; transition: transform .12s, border-color .12s; }
.pcard:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--gold); }
.pcard:disabled { opacity: .35; cursor: not-allowed; }
.pcard .nm { font: 700 17px/1.1 var(--f-display); overflow-wrap: anywhere; }
.pcard .ct { font-size: 12px; color: var(--muted); }
.pcard dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12px; text-align: left; }
.pcard dt { color: var(--muted); }
.pcard dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.slot .stat { font: 500 11px/1.3 var(--f-mono); color: var(--fg); }
.roles { font: 600 10.5px/1.3 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
.roles .sec { color: var(--muted); }
.chem { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
.chem b { color: var(--bad); font-weight: 600; }
.chem.ok b { color: var(--good); }
.chemlist { margin: 0; padding-left: 1.2em; color: var(--muted); text-align: left; }
.tag { font: 600 10px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Lineup */
.rack { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 8px; min-height: 70px; text-align: center; display: grid; align-content: center; gap: 2px; }
.slot.filled { border-style: solid; }
.slot.current { border-color: var(--gold); }
.slot .who { font: 700 15px/1.15 var(--f-display); overflow-wrap: anywhere; }
.slot .from { font-size: 11px; color: var(--muted); line-height: 1.3; }
.slot.empty .who { color: var(--muted); font: 500 13px/1.2 var(--f-body); }

/* Result */
.board { display: grid; gap: 10px; }
.lbform { display: flex; flex-wrap: wrap; gap: 8px; }
.lbform input { flex: 1 1 160px; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; font: 500 14px/1 var(--f-body); }
.lbform input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.lb li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 6px; background: var(--panel-2); font-size: 14px; }
.lb li span:nth-child(2) { overflow-wrap: anywhere; }
.lb li span:last-child { font: 600 11px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lb li.mine { outline: 1px solid var(--gold); }
.lb li.empty { display: block; color: var(--muted); }
/* Start page: leaderboard + your recent runs */
.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.home-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.runs li { grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr); }
.runs .pl { font: 600 11px/1.3 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--tc) !important; }
.runs .five { font-size: 12.5px; color: var(--fg); overflow-wrap: anywhere; }
.runs .meta { grid-column: 2; font-size: 11.5px; color: var(--muted); }
/* Stat pop-up on the results page */
[data-pick] { cursor: help; }
.slot[data-pick]:hover, .slot[data-pick]:focus-visible { border-color: var(--gold); }
tr[data-pick]:hover td, tr[data-pick]:focus-visible td { background: var(--panel-2); }
tr[data-pick]:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.tip { position: fixed; z-index: 50; width: 250px; max-width: calc(100vw - 16px); background: var(--panel-2); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: grid; gap: 4px; pointer-events: none; font-size: 13px; }
.tip b { font: 700 17px/1.1 var(--f-display); }
.tip .from { color: var(--muted); font-size: 12px; }
.tip dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.tip dt { color: var(--muted); }
.tip dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.result { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 18px; }
.verdict { display: grid; gap: 6px; text-align: center; justify-items: center; }
.verdict .tier { font: 700 clamp(34px, 9vw, 56px)/.95 var(--f-display); text-transform: uppercase; color: var(--tc); }
.verdict .gap { font: 500 20px/1.2 var(--f-mono); }
.verdict p { margin: 0; color: var(--muted); max-width: 56ch; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 11px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px 0; }
td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; padding-right: 0; }
.tablebox { overflow-x: auto; }
.chartbox { overflow-x: auto; }
svg text { font-family: var(--f-mono); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.note { margin: 0; color: var(--muted); font-size: 12.5px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

@media (max-width: 640px) {
  .pgrid, .rack { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .pcard { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "nm tag" "ct tag"; text-align: left; padding: 10px 14px; gap: 0 10px; }
  .pcard .nm { grid-area: nm; } .pcard .ct { grid-area: ct; } .pcard .tag { grid-area: tag; align-self: center; }
  .pcard dl { grid-column: 1 / -1; grid-template-columns: repeat(4, auto auto); justify-content: space-between; gap: 2px 6px; }
  .slot .stat, .slot .roles, .pcard .roles { grid-column: 1 / -1; }
  .home { grid-template-columns: minmax(0, 1fr); }
  .slot { min-height: 0; grid-template-columns: minmax(0, 1fr) auto; text-align: left; padding: 8px 12px; align-items: baseline; }
  .row { font-size: 21px; } .row.s { font-size: 17px; } .row.xs { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { .pcard { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Major <span>Draft</span></h1>
    <div class="top-right">
      <span class="round">Round <b id="cRound">1/5</b></span>
      <div class="seg" role="radiogroup" aria-label="Game mode" id="modes"></div>
      <button class="sound" id="bSound" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <section class="machine" aria-live="polite">
    <div class="cell">
      <div class="frame"><span class="lbl">Major</span><div class="drum" id="drumM"><div class="strip"></div><div class="shade"></div></div></div>
      <div class="sub" id="subM"></div>
      <button class="respin" id="reM">Respin Major + team · <span id="reMn">1</span> left</button>
    </div>
    <div class="cell">
      <div class="frame team"><span class="lbl">Team</span><div class="drum" id="drumT"><div class="strip"></div><div class="shade"></div></div></div>
      <div class="sub" id="subT"></div>
      <button class="respin" id="reT">Respin team · <span id="reTn">1</span> left</button>
    </div>
  </section>

  <button class="spin" id="bSpin">Spin</button>
  <p class="hint" id="hint"></p>
  <section class="home" id="home" aria-label="Past runs" hidden>
    <div class="home-col">
      <div class="eyebrow" id="homeBoardTitle">Leaderboard</div>
      <ol class="lb" id="homeBoard"><li class="empty">Loading…</li></ol>
    </div>
    <div class="home-col">
      <div class="eyebrow">Your recent runs</div>
      <ol class="lb runs" id="homeRuns"></ol>
    </div>
  </section>
  <section class="pgrid" id="players" aria-label="Players to sign"></section>

  <section aria-label="Your lineup">
    <div class="eyebrow" style="margin-bottom:8px">Your lineup</div>
    <div class="rack" id="rack"></div>
    <p class="chem" id="chem" hidden></p>
  </section>

  <section class="result" id="result" hidden></section>
  <div class="tip" id="tip" role="tooltip" hidden></div>
</div>

// Thresholds come from the real averages: back-to-back winners +28.9%, winners +23.3%,
// runners-up +12.5%, semifinal exits +11.5%, quarterfinal exits +5.4%, missed playoffs −10.0%.
// Dynasty is set at the back-to-back average; the others sit at the midpoint between neighbouring finishes.
const TIERS = [
  { min: 28.9, name: "Dynasty", c: "var(--r-gold)", text: "Your lineup stacks up with the teams that won Majors back to back: fnatic 2015, Luminosity/SK 2016, Astralis 2018–19 and Vitality 2025." },
  { min: 17.9, name: "Major Champion", c: "var(--gold)", text: "Your lineup sits in the range of real Major winners. You lift the trophy." },
  { min: 12.0, name: "Grand Finalist", c: "var(--r-red)", text: "Your lineup plays like a real runner-up. You reach the final and probably lose it." },
  { min: 8.45, name: "Semifinalist", c: "var(--r-pink)", text: "Your lineup plays like a real semifinalist. A deep run that stops one series short." },
  { min: -2.3, name: "Quarterfinalist", c: "var(--r-purple)", text: "Your lineup plays like a real quarterfinalist. You make the playoffs and go out first." },
  { min: -Infinity, name: "Out before playoffs", c: "var(--r-light)", text: "Your lineup plays like the teams that missed the playoffs. This roster goes home after the Swiss stage." },
];
const tierOf = g => TIERS.find(t => g >= t.min);
const STAGE_C = { "Winner": "var(--gold)", "Runner-up": "var(--r-red)", "Semifinal exit": "var(--r-pink)", "Quarterfinal exit": "var(--r-purple)", "Missed playoffs": "var(--r-light)", "Unknown (QF data missing)": "var(--r-grey)" };
const stageLabel = t => t.b2b ? "Won (back to back)" : t.s === "Winner" ? "Won the Major" : t.s.startsWith("Unknown") ? "Group stage / QF" : t.s;
const SHORT = { "Ninjas in Pyjamas": "NiP", "Natus Vincere": "NAVI", "Virtus.pro": "VP", "Copenhagen Flames": "CPH Flames", "The MongolZ": "MongolZ", "Team Liquid": "Liquid", "Counter Logic Gaming": "CLG" };
const teamShort = n => SHORT[n] || n;
const majorShort = m => m.city.replace(/ (\d\d)(\d\d)$/, " '$2");

const MODES = {
  normal: { name: "Normal", hint: "You see each player's role, K/D, rating, K−D and maps, and how their team really finished. Too many of one role costs placement." },
  elite: { name: "Elite", hint: "Names only. No stats, roles or real finish until the end. Too many of one role still costs placement." },
};

const pGap = (m, p) => (p[3] / m.avg - 1) * 100;
const fmtPct = g => (g >= 0 ? "+" : "−") + Math.abs(g).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rand = n => Math.floor(Math.random() * n);
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

const ROUNDS = 5, ROW = 44;
let S;
function readMode() { try { return localStorage.getItem("majorDraftMode") === "elite" ? "elite" : "normal"; } catch (e) { return "normal"; } }
function writeMode(v) { try { localStorage.setItem("majorDraftMode", v); } catch (e) {} }
function fresh(mode) {
  return { mode: mode || readMode(), round: 0, reM: 1, reT: 1, phase: "spin", major: null, team: null, lineup: [], spinning: false,
           online: ONLINE, game: null, pending: null, placement: null, error: "" };
}

const OFFLINE_MSG = "Couldn't reach the leaderboard server, so this game is offline and won't be saved.";
async function rpc(fn, args) {
  const headers = { apikey: DB.key, "Content-Type": "application/json" };
  if (DB.key.startsWith("eyJ")) headers.Authorization = `Bearer ${DB.key}`;   // legacy anon keys are JWTs
  const res = await fetch(`${DB.url.replace(/\/$/, "")}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(args) });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.message) || `Server error (${res.status})`);
  return body;
}
// Ask the server for the next roll. Returns DATA indexes, or null when playing offline.
async function serverRoll(kind) {
  if (!S.online) return null;
  let st;
  if (kind === "major" || kind === "team") st = await rpc("md_respin", { p_game: S.game, p_kind: kind });
  else if (!S.game) { st = await rpc("md_start_game", { p_mode: S.mode }); S.game = st.game_id; }
  else st = S.pending || await rpc("md_get_game", { p_game: S.game });
  S.pending = null;
  S.reM = st.respins.major; S.reT = st.respins.team;
  const mi = DATA.findIndex(m => m.id === st.roll.major_id);
  if (mi < 0) throw new Error("The game data is out of date. Refresh the page.");
  return { mi, ti: st.roll.team_slot };
}
const elite = () => S.mode === "elite";

// Drums
function rowHtml(text, ghost) {
  const cls = text.length > 11 ? "xs" : text.length > 8 ? "s" : "";
  return `<div class="row ${cls} ${ghost ? "ghost" : ""}">${esc(text)}</div>`;
}
function setDrum(id, items, at) {
  const drum = $(id), strip = drum.querySelector(".strip");
  strip.innerHTML = items.map(t => rowHtml(t)).join("");
  strip.style.transition = "none";
  strip.style.transform = `translateY(${drum.clientHeight / 2 - (at * ROW + ROW / 2)}px)`;
}
function idleDrum(id, pool) {
  setDrum(id, [pool[rand(pool.length)], "?", pool[rand(pool.length)]], 1);
}
// Spin sound and its tick map (docs/sounds/spin.json). Each tick in the sound moves a drum by exactly one row,
// so the clicks line up with names passing the centre line. The Major drum stops 4 ticks early; the Team drum lands on the last tick.
let SPIN = {"flick_strike_s": 0.337, "tick_times_s": [0.678, 0.736, 0.783, 0.84, 0.912, 0.981, 1.052, 1.121, 1.18, 1.226, 1.296, 1.366, 1.424, 1.482, 1.541, 1.6, 1.681, 1.74, 1.798, 1.867, 1.926, 1.984, 2.031, 2.159, 2.21, 2.311, 2.381, 2.474, 2.544, 2.684, 2.836, 2.987, 3.15, 3.278, 3.456, 3.617, 3.78, 4.013, 4.317, 4.596, 5.04, 5.705]};
fetch("sounds/spin.json").then(r => r.json()).then(j => { if (Array.isArray(j.tick_times_s) && j.tick_times_s.length > 8) SPIN = j; }).catch(() => {});
let sfx = null;
try { sfx = new Audio("sounds/spin.m4a"); sfx.preload = "auto"; } catch (e) {}
function readSound() { try { return localStorage.getItem("majorDraftSound") !== "off"; } catch (e) { return true; } }
let soundOn = readSound();
function renderSound() { $("bSound").textContent = soundOn ? "Sound on" : "Sound off"; $("bSound").setAttribute("aria-pressed", soundOn); }

function startClock() {
  let t0 = performance.now();
  if (soundOn && sfx) {
    try {
      sfx.pause(); sfx.currentTime = 0;
      // once audio actually starts, pin the clock to it so ticks and rows stay together
      sfx.onplaying = () => { t0 = performance.now() - sfx.currentTime * 1000; sfx.onplaying = null; };
      const pr = sfx.play(); if (pr) pr.catch(() => {});
    } catch (e) {}
  }
  return () => (performance.now() - t0) / 1000;
}
// drum position in rows at time t, for a drum that lands after `land` ticks
function rowsAt(t, land) {
  const tk = SPIN.tick_times_s, flick = SPIN.flick_strike_s || 0;
  if (t <= flick) return 0;
  if (t >= tk[land - 1]) return land;
  let i = 0; while (tk[i] <= t) i++;
  const prevT = i === 0 ? flick : tk[i - 1];
  return i + (t - prevT) / (tk[i] - prevT);
}
function spinDrums(specs) {
  // specs: [{ id, pool, target, land }]
  const ticks = SPIN.tick_times_s.length;
  specs.forEach(s => {
    s.land = Math.max(4, Math.min(ticks, s.land));
    const items = [];
    for (let i = 0; i <= s.land + 1; i++) items.push(i === s.land ? s.target : s.pool[rand(s.pool.length)]);
    if (items[s.land - 1] === s.target) items[s.land - 1] = "?";
    if (items[s.land + 1] === s.target) items[s.land + 1] = "?";
    const drum = $(s.id); s.strip = drum.querySelector(".strip"); s.mid = drum.clientHeight / 2 - ROW / 2;
    s.strip.innerHTML = items.map(t => rowHtml(t)).join("");
    s.strip.style.transition = "none";
    s.strip.style.transform = `translateY(${s.mid}px)`;
  });
  const place = (s, pos) => { s.strip.style.transform = `translateY(${(s.mid - pos * ROW).toFixed(1)}px)`; };
  if (reduced()) { specs.forEach(s => place(s, s.land)); return Promise.resolve(); }
  const now = startClock();
  const end = Math.max(...specs.map(s => SPIN.tick_times_s[s.land - 1]));
  return new Promise(resolve => {
    (function frame() {
      const t = now();
      specs.forEach(s => place(s, rowsAt(t, s.land)));
      if (t >= end) { setTimeout(resolve, 120); return; }
      requestAnimationFrame(frame);
    })();
  });
}
const MAJOR_POOL = DATA.map(majorShort);
const TEAM_POOL = [...new Set(DATA.flatMap(m => m.teams.map(t => teamShort(t.n))))];

async function spinBoth(kind = "spin") {
  const prev = { major: S.major, team: S.team, phase: S.phase };
  S.spinning = true; S.error = ""; S.phase = "spin"; S.major = null; S.team = null; render();
  let r = null;
  try { r = await serverRoll(kind); }
  catch (e) {
    if (!S.game) { S.online = false; S.error = OFFLINE_MSG; }
    else { Object.assign(S, prev, { spinning: false, error: e.message }); render(); return; }
  }
  if (!r) {
    if (kind === "major") S.reM--;
    const mi = rand(DATA.length); r = { mi, ti: rand(DATA[mi].teams.length) };
  }
  const m = DATA[r.mi], n = SPIN.tick_times_s.length;
  await spinDrums([
    { id: "drumM", pool: MAJOR_POOL, target: majorShort(m), land: n - 4 },
    { id: "drumT", pool: TEAM_POOL, target: teamShort(m.teams[r.ti].n), land: n },
  ]);
  Object.assign(S, { major: r.mi, team: r.ti, phase: "pick", spinning: false }); render();
}
async function spinTeam() {
  const m = DATA[S.major], old = S.team;
  S.spinning = true; S.error = ""; S.team = null; render();
  let ti = null;
  try { const r = await serverRoll("team"); if (r) ti = r.ti; }
  catch (e) { Object.assign(S, { team: old, spinning: false, error: e.message }); render(); return; }
  if (ti == null) { S.reT--; ti = rand(m.teams.length - 1); if (ti >= old) ti++; }
  await spinDrums([{ id: "drumT", pool: m.teams.map(t => teamShort(t.n)), target: teamShort(m.teams[ti].n), land: SPIN.tick_times_s.length }]);
  Object.assign(S, { team: ti, spinning: false }); render();
}

function render() {
  const m = S.major != null ? DATA[S.major] : null;
  const t = m && S.team != null ? m.teams[S.team] : null;
  const done = S.phase === "done", busy = S.spinning;

  $("cRound").textContent = Math.min(S.round + 1, ROUNDS) + "/" + ROUNDS;
  const lockMode = S.round > 0 || busy || S.phase !== "spin";
  $("modes").innerHTML = Object.entries(MODES).map(([k, v]) =>
    `<button role="radio" aria-checked="${S.mode === k}" class="${S.mode === k ? "on" : ""}" data-mode="${k}" ${lockMode && S.mode !== k ? "disabled" : ""}>${v.name}</button>`).join("");
  $("modes").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.disabled || S.mode === b.dataset.mode) return;
    S.mode = b.dataset.mode; writeMode(S.mode); render();
  });

  if (!busy) {
    if (m) setDrum("drumM", [MAJOR_POOL[(S.major + 23) % 24], majorShort(m), MAJOR_POOL[(S.major + 1) % 24]], 1); else idleDrum("drumM", MAJOR_POOL);
    if (t) setDrum("drumT", [teamShort(m.teams[(S.team + 15) % 16].n), teamShort(t.n), teamShort(m.teams[(S.team + 1) % 16].n)], 1); else idleDrum("drumT", TEAM_POOL);
  }
  $("subM").innerHTML = m && !busy ? esc(m.name) : "";
  $("subT").innerHTML = t && !busy ? esc(t.n) + (elite() ? "" : ` <span class="chip ${t.s === "Winner" ? "win" : ""}">${esc(stageLabel(t))}</span>`) : "";

  const picking = S.phase === "pick" && !done;
  $("reMn").textContent = S.reM; $("reTn").textContent = S.reT;
  $("reM").disabled = !picking || busy || S.reM < 1;
  $("reT").disabled = !picking || busy || S.reT < 1;
  $("reM").hidden = $("reT").hidden = done;

  $("bSpin").hidden = S.phase !== "spin" || done;
  $("bSpin").disabled = busy;
  $("bSpin").textContent = busy ? "Spinning…" : "Spin";
  $("hint").textContent = S.error ? S.error : done ? "" : busy ? "" : picking ? (elite() ? "Sign one player. Stats are revealed after round 5." : "Sign one player.") : S.round === 0 ? MODES[S.mode].hint : "Spin for round " + (S.round + 1) + ".";

  let ph = "";
  if (picking && t) {
    const used = new Set(S.lineup.map(l => DATA[l.m].teams[l.t].p[l.p][1]));
    t.p.forEach((p, i) => {
      const taken = used.has(p[1]);
      ph += `<button class="pcard" data-p="${i}" ${taken || busy ? "disabled" : ""}>
        <span class="nm">${esc(p[0])}</span><span class="ct">${esc(p[2])}</span>${taken ? `<span class="tag">Already signed</span>` : ""}${elite() ? "" : roleHtml(p)}${elite() ? "" : `<dl>
          <dt>K/D</dt><dd>${p[3].toFixed(2)}</dd><dt>Rating ${m.ver}</dt><dd>${p[4].toFixed(2)}</dd>
          <dt>K−D</dt><dd>${p[5] > 0 ? "+" : ""}${p[5]}</dd><dt>Maps</dt><dd>${p[6]}</dd></dl>`}</button>`;
    });
  }
  $("players").innerHTML = ph;
  $("players").hidden = !ph;
  $("players").querySelectorAll(".pcard").forEach(b => b.onclick = () => pick(+b.dataset.p));

  let rh = "";
  for (let i = 0; i < ROUNDS; i++) {
    const l = S.lineup[i];
    if (l) {
      const lm = DATA[l.m], lt = lm.teams[l.t], p = lt.p[l.p];
      rh += `<div class="slot filled" ${done ? `data-pick="${i}" tabindex="0" aria-describedby="tip"` : ""}><span class="who">${esc(p[0])}</span><span class="from">${esc(teamShort(lt.n))} · ${esc(majorShort(lm))}</span>${elite() && !done ? "" : roleHtml(p)}${elite() && !done ? "" : `<span class="stat">K/D ${p[3].toFixed(2)} · Rtg ${p[4].toFixed(2)}</span>`}</div>`;
    } else {
      rh += `<div class="slot empty ${i === S.round && !done ? "current" : ""}"><span class="who">${i === S.round && !done ? "Signing" : "Slot " + (i + 1)}</span></div>`;
    }
  }
  $("rack").innerHTML = rh;
  // live chemistry while drafting (Normal mode only; Elite sees it on the result screen)
  const chemOn = !elite() && !done && S.lineup.length >= 2;
  $("chem").hidden = !chemOn;
  if (chemOn) {
    const c = chemistry(lineupPlayers());
    $("chem").className = "chem" + (c.notes.length ? "" : " ok");
    $("chem").innerHTML = c.notes.length ? `<b>Role clash:</b> ${c.notes.map(esc).join("; ")}. This will cost you placement.` : `<b>Chemistry:</b> no role clashes so far.`;
  }

  // start page: leaderboard and recent runs, shown before the first spin
  const home = S.round === 0 && S.phase === "spin" && !busy && !S.lineup.length && !S.major;
  $("home").hidden = !home;
  if (home) renderHome();
  if (done) bindTips($("rack"));

  $("result").hidden = !done;
  if (done) renderResult();
}

async function pick(i) {
  if (S.spinning) return;
  if (S.online) {
    S.spinning = true; S.error = ""; render();
    try {
      const st = await rpc("md_pick", { p_game: S.game, p_slot: i });
      if (st.finished) S.placement = st.placement; else S.pending = st;
    } catch (e) { S.spinning = false; S.error = e.message; render(); return; }
    S.spinning = false;
  }
  S.lineup.push({ m: S.major, t: S.team, p: i });
  S.round++;
  S.phase = S.round >= ROUNDS ? "done" : "spin";
  if (S.phase !== "done") { S.major = null; S.team = null; }
  render();
  if (S.phase === "done") $("result").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
}

const lineupGap = () => S.lineup.reduce((a, l) => { const m = DATA[l.m]; return a + pGap(m, m.teams[l.t].p[l.p]); }, 0) / S.lineup.length;
// Chemistry: too many of one role makes the team play worse. Penalties are in K/D-gap points;
// one placement band is roughly 4-11 points. Roles come from player_roles.csv (p[7] main role,
// p[8] secondary role, p[9] IGL type). Must match major_draft.chemistry() in db/schema.sql.
const RIFLE_ROLES = ["Entry", "Trader", "Support", "Closer", "Star"];
const lineupPlayers = () => S.lineup.map(l => DATA[l.m].teams[l.t].p[l.p]);
function chemistry(ps) {
  const notes = []; let pen = 0;
  const awp = ps.filter(p => p[7] === "AWPer").length;
  const partAwp = ps.filter(p => p[8] === "AWP").length;
  const igl = ps.filter(p => p[9]).length;
  if (awp >= 2) { pen -= 6 * (awp - 1); notes.push(`${awp} main AWPers fighting over one AWP`); }
  // two IGLs is fine (one calls, one helps); three or more call over each other
  if (igl >= 3) { pen -= 4 * (igl - 2); notes.push(`${igl} in-game leaders calling over each other`); }
  const counts = {};
  ps.forEach(p => { if (RIFLE_ROLES.includes(p[7])) counts[p[7]] = (counts[p[7]] || 0) + 1; });
  for (const [role, n] of Object.entries(counts)) {
    if (n >= 3) { pen -= 4 * (n - 2); notes.push(`${n} ${role} players doing the same job`); }
  }
  if (ps.length === 5) {   // missing roles only count once the roster is full
    if (awp === 0) { pen -= partAwp ? 2 : 4; notes.push(partAwp ? "no main AWPer, only a part-time one" : "nobody to hold the AWP"); }
    if (igl === 0) { pen -= 3; notes.push("no in-game leader"); }
  }
  return { pen, notes };
}
const finalGap = () => lineupGap() + chemistry(lineupPlayers()).pen;
function roleHtml(p) {
  const sec = p[8] ? `<span class="sec"> · 2nd: ${esc(p[8])}</span>` : "";
  return `<span class="roles">${esc(p[7])}${p[9] ? " · " + esc(p[9]) : ""}${sec}</span>`;
}
// ---- Start page: leaderboard + this browser's recent runs
const RUNS_KEY = "majorDraftRuns";
function readRuns() { try { return JSON.parse(localStorage.getItem(RUNS_KEY)) || []; } catch (e) { return []; } }
function saveRun(run) { try { localStorage.setItem(RUNS_KEY, JSON.stringify([run, ...readRuns()].slice(0, 20))); } catch (e) {} }
const boardCache = {};
function renderHome() {
  const runs = readRuns().slice(0, 6);
  $("homeRuns").innerHTML = runs.length ? runs.map(r => {
    const t = TIERS.find(x => x.name === r.placement) || TIERS[TIERS.length - 1];
    const when = new Date(r.at).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    return `<li style="--tc:${t.c}"><span class="pl">${esc(r.placement)}</span><span class="five">${r.five.map(esc).join(", ")}</span><span class="meta">${esc(MODES[r.mode]?.name || r.mode)} mode · ${esc(when)}</span></li>`;
  }).join("") : `<li class="empty">No runs yet. Spin to start your first draft.</li>`;

  $("homeBoardTitle").textContent = `Leaderboard · ${MODES[S.mode].name} mode`;
  if (!ONLINE) { $("homeBoard").innerHTML = `<li class="empty">The leaderboard isn't set up for this copy of the game.</li>`; return; }
  const mode = S.mode, cached = boardCache[mode];
  if (cached) showHomeBoard(cached);
  if (!cached || Date.now() - cached.at > 60000) {
    rpc("md_leaderboard", { p_mode: mode, p_limit: 10 })
      .then(rows => { boardCache[mode] = { at: Date.now(), rows }; if (S.mode === mode && !$("home").hidden) showHomeBoard(boardCache[mode]); })
      .catch(() => { if (!cached) $("homeBoard").innerHTML = `<li class="empty">Couldn't load the leaderboard. Check your connection and refresh.</li>`; });
  }
}
function showHomeBoard({ rows }) {
  $("homeBoard").innerHTML = rows.length
    ? rows.map(r => `<li><span class="num">${r.rank}</span><span>${esc(r.name)}</span><span>${esc(r.placement)}</span></li>`).join("")
    : `<li class="empty">No scores yet. Finish a draft and submit yours to be first.</li>`;
}

// ---- Results page: hover (or focus / tap) a signed player to see their stats with the team they came from
function tipHtml(l) {
  const m = DATA[l.m], t = m.teams[l.t], p = t.p[l.p];
  return `<b>${esc(p[0])}</b><span class="from">${esc(t.n)} · ${esc(m.name)}</span>${roleHtml(p)}
    <dl><dt>K/D</dt><dd>${p[3].toFixed(2)}</dd><dt>Rating ${m.ver}</dt><dd>${p[4].toFixed(2)}</dd>
    <dt>K−D</dt><dd>${p[5] > 0 ? "+" : ""}${p[5]}</dd><dt>Maps</dt><dd>${p[6]}</dd>
    <dt>Team finish</dt><dd>${esc(stageLabel(t))}</dd></dl>`;
}
function showTip(el) {
  const l = S.lineup[+el.dataset.pick]; if (!l) return;
  const tip = $("tip"); tip.innerHTML = tipHtml(l); tip.hidden = false; tip.dataset.for = el.dataset.pick + el.tagName;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, hgt = tip.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
  const top = r.bottom + 8 + hgt > innerHeight ? Math.max(8, r.top - hgt - 8) : r.bottom + 8;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
const hideTip = () => { $("tip").hidden = true; };
function bindTips(root) {
  root.querySelectorAll("[data-pick]").forEach(el => {
    // mouseover (not mouseenter) also fires when the element appears under a still pointer
    el.onmouseover = el.onmousemove = () => { if ($("tip").hidden || $("tip").dataset.for !== el.dataset.pick + el.tagName) showTip(el); };
    el.onfocus = () => showTip(el);
    el.onmouseleave = hideTip;
    el.onblur = hideTip;
    el.onclick = () => showTip(el);   // tap on phones
  });
}
addEventListener("scroll", hideTip, { passive: true });
document.addEventListener("click", e => { if (!e.target.closest("[data-pick]")) hideTip(); });

const bestKey = () => "majorDraftBest-" + S.mode;
function readBest() { try { const v = localStorage.getItem(bestKey()); return v == null ? null : +v; } catch (e) { return null; } }
function writeBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }

function renderResult() {
  const chem = chemistry(lineupPlayers());
  const g = finalGap(), tier = (S.placement && TIERS.find(t => t.name === S.placement)) || tierOf(g);
  if (S.scored == null) {
    S.prevBest = readBest(); if (S.prevBest == null || g > S.prevBest) writeBest(g); S.scored = g;
    saveRun({ mode: S.mode, placement: tier.name, at: Date.now(), five: S.lineup.map(l => DATA[l.m].teams[l.t].p[l.p][0]) });
  }
  const isBest = S.prevBest == null || g > S.prevBest;
  const all = []; DATA.forEach(m => m.teams.forEach(t => all.push({ m, t })));
  const near = all.slice().sort((a, b) => Math.abs(a.t.g - g) - Math.abs(b.t.g - g)).slice(0, 5);
  const beat = all.filter(x => x.t.g < g).length;
  const rows = S.lineup.map((l, i) => {
    const m = DATA[l.m], t = m.teams[l.t], p = t.p[l.p];
    return `<tr data-pick="${i}" tabindex="0" aria-describedby="tip"><td>${esc(p[0])}</td><td>${esc(p[7])}${p[9] ? " · IGL" : ""}${p[8] ? ` <span class="sec">(2nd: ${esc(p[8])})</span>` : ""}</td><td>${esc(t.n)} · ${esc(m.city)}</td><td class="r num">${p[3].toFixed(2)}</td><td class="r num">${p[4].toFixed(2)}</td></tr>`;
  }).join("");
  const nearRows = near.map(x => `<tr><td>${esc(x.t.n)}</td><td>${esc(x.m.city)}</td><td>${esc(stageLabel(x.t))}</td></tr>`).join("");
  $("result").innerHTML = `
    <div class="verdict" style="--tc:${tier.c}">
      <span class="eyebrow">${MODES[S.mode].name} mode · ${isBest ? "new personal best" : "best so far: " + tierOf(S.prevBest).name}</span>
      <span class="tier">${tier.name}</span>
      <p>${tier.text} It rates above ${beat} of the 384 real Major teams.</p>
      ${chem.notes.length
        ? `<p><b>Chemistry cost you:</b></p><ul class="chemlist">${chem.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`
        : `<p><b>Chemistry:</b> every role covered, no clashes.</p>`}
      <button class="spin" id="bAgain" style="margin-top:8px">Draft again</button>
    </div>
    ${ONLINE ? `<div class="board">
      <div class="eyebrow">Leaderboard · ${MODES[S.mode].name} mode</div>
      ${S.online && S.game ? `<form class="lbform" id="lbForm" novalidate>
        <input id="lbName" name="lbName" maxlength="16" autocomplete="nickname" placeholder="Your name" aria-label="Your name for the leaderboard">
        <button class="respin" id="lbSubmit" type="submit">Submit score</button></form>` : ""}
      <p class="note" id="lbStatus">${S.online && S.game ? "Letters, numbers and _ only, up to 16." : "This game was played offline, so it can't go on the leaderboard."}</p>
      <ol class="lb" id="lbList"><li class="empty">Loading…</li></ol></div>` : ""}
    <div class="tablebox"><div class="eyebrow" style="margin-bottom:8px">Your five</div>
      <table><thead><tr><th>Player</th><th>Role</th><th>From</th><th class="r">K/D</th><th class="r">Rating</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="tablebox"><div class="eyebrow" style="margin-bottom:8px">Closest real teams</div>
      <table><thead><tr><th>Team</th><th>Major</th><th>Real finish</th></tr></thead><tbody>${nearRows}</tbody></table></div>
    <div><div class="eyebrow" style="margin-bottom:8px">Where real Major teams finished</div>
      <div class="chartbox"><svg id="chart" role="img" aria-label="Strip chart of real Major teams by finish, weaker to stronger, with your lineup marked"></svg></div>
      <div class="legend" id="legend"></div></div>
    <p class="note">Your five are scored on how their K/D compared with the average team at each player's own Major, then lowered for role clashes (two main AWPers, three IGLs, three players in the same role, or no AWPer or IGL at all), then placed among every real Major team. Dynasty is the level of the teams that won back to back. The other bands sit halfway between neighbouring real finishes.</p>`;
  $("bAgain").onclick = () => { hideTip(); S = fresh(S.mode); render(); window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); };
  renderChart(g);
  bindTips($("result"));
  if (ONLINE) setupBoard();
}

function setupBoard() {
  const form = $("lbForm");
  if (form) {
    try { $("lbName").value = localStorage.getItem("majorDraftName") || ""; } catch (e) {}
    form.onsubmit = async ev => {
      ev.preventDefault();
      const name = $("lbName").value.trim();
      if (!/^[A-Za-z0-9_]{1,16}$/.test(name)) { $("lbStatus").textContent = "Use 1–16 letters, numbers or _."; return; }
      $("lbSubmit").disabled = true; $("lbStatus").textContent = "Saving…";
      try {
        const r = await rpc("md_submit_score", { p_game: S.game, p_name: name });
        try { localStorage.setItem("majorDraftName", name); } catch (e) {}
        form.hidden = true;
        $("lbStatus").textContent = `Saved. You're #${r.rank} in ${MODES[S.mode].name} mode.`;
        loadBoard({ name, rank: r.rank });
      } catch (e) { $("lbSubmit").disabled = false; $("lbStatus").textContent = e.message; }
    };
  }
  loadBoard(null);
}
async function loadBoard(mine) {
  try {
    const rows = await rpc("md_leaderboard", { p_mode: S.mode, p_limit: 10 });
    $("lbList").innerHTML = rows.length ? rows.map(r =>
      `<li class="${mine && r.name === mine.name && r.rank === mine.rank ? "mine" : ""}"><span class="num">${r.rank}</span><span>${esc(r.name)}</span><span>${esc(r.placement)}</span></li>`).join("")
      : `<li class="empty">No scores yet. Submit yours to be first.</li>`;
  } catch (e) { $("lbList").innerHTML = `<li class="empty">Couldn't load the leaderboard. Check your connection and refresh.</li>`; }
}

function renderChart(g) {
  const svg = $("chart");
  const rowsDef = [
    ["Back-to-back", t => t.b2b, "var(--r-gold)"], ["Won", t => t.s === "Winner" && !t.b2b, "var(--gold)"],
    ["Runner-up", t => t.s === "Runner-up", "var(--r-red)"], ["Semifinal exit", t => t.s === "Semifinal exit", "var(--r-pink)"],
    ["Quarterfinal exit", t => t.s === "Quarterfinal exit", "var(--r-purple)"], ["Missed playoffs", t => t.s === "Missed playoffs", "var(--r-light)"],
  ];
  const W = 680, L = 128, R = 16, T = 30, rowH = 28, H = T + rowH * rowsDef.length + 34, lo = -40, hi = 45;
  const x = v => L + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (W - L - R);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W);
  svg.style.maxWidth = "100%"; svg.style.height = "auto"; svg.style.minWidth = "560px";
  const short = { "Out before playoffs": "Out", "Quarterfinalist": "QF", "Semifinalist": "SF", "Grand Finalist": "Final", "Major Champion": "Champ", "Dynasty": "Dynasty" };
  let h = ""; const bandTop = T - 8, bandH = rowH * rowsDef.length + 8;
  TIERS.forEach((t, i) => {
    const a = x(Math.max(t.min, lo)), b = i === 0 ? x(hi) : x(TIERS[i - 1].min);
    h += `<rect x="${a}" y="${bandTop}" width="${b - a}" height="${bandH}" fill="${t.c}" fill-opacity="${i % 2 ? .05 : .1}"/>`;
    if (isFinite(t.min)) h += `<line x1="${a}" x2="${a}" y1="${bandTop}" y2="${bandTop + bandH}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
    h += `<text x="${(a + b) / 2}" y="${T - 14}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${short[t.name]}</text>`;
  });
  rowsDef.forEach(([name, f, c], i) => {
    const cy = T + i * rowH + rowH / 2;
    h += `<text x="${L - 10}" y="${cy + 4}" text-anchor="end" font-size="11.5" fill="var(--fg)">${name}</text>`;
    DATA.forEach(m => m.teams.filter(f).forEach(t => {
      h += `<circle cx="${x(t.g).toFixed(1)}" cy="${(cy + (Math.random() - .5) * 11).toFixed(1)}" r="3.6" fill="${c}" fill-opacity=".75"><title>${esc(t.n)} · ${esc(m.city)}</title></circle>`;
    }));
  });
  const axisY = T + rowH * rowsDef.length + 6;
  h += `<line x1="${L}" x2="${W - R}" y1="${axisY}" y2="${axisY}" stroke="var(--line)"/><text x="${L}" y="${axisY + 18}" font-size="10.5" fill="var(--muted)">← Weaker</text><text x="${W - R}" y="${axisY + 18}" text-anchor="end" font-size="10.5" fill="var(--muted)">Stronger →</text>`;
  const xx = x(g);
  h += `<line x1="${xx}" x2="${xx}" y1="${bandTop - 2}" y2="${axisY}" stroke="var(--fg)" stroke-width="2"/><rect x="${xx - 20}" y="${axisY - 24}" width="40" height="18" rx="2" fill="var(--fg)"/><text x="${xx}" y="${axisY - 11}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--bg)">You</text>`;
  svg.innerHTML = h;
  $("legend").innerHTML = rowsDef.map(([n, , c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("");
}

$("bSpin").onclick = () => spinBoth();
$("reM").onclick = () => { if (S.reM >= 1) spinBoth("major"); };
$("reT").onclick = () => { if (S.reT >= 1) spinTeam(); };
$("bSound").onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("majorDraftSound", soundOn ? "on" : "off"); } catch (e) {}
  if (!soundOn && sfx) sfx.pause();
  renderSound();
};
S = fresh();
renderSound();
render();
</script>
</body>
</html>
